<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영수증 메일 발송 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 my-8">
        <h1 class="text-2xl font-extrabold mb-6 text-slate-800 flex items-center gap-2">
            <span>🧾</span> 영수증 정산 폼
        </h1>
        
        <form id="receiptForm" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">집행 일자</label>
                    <input type="date" id="date" required class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">집행처</label>
                    <input type="text" id="vendor" placeholder="식당명 또는 매장명" required class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">식비 (원)</label>
                    <input type="text" id="mealExp" placeholder="0" class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none text-right font-mono" oninput="formatCurrency(this)">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">간식비 (원)</label>
                    <input type="text" id="snackExp" placeholder="0" class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none text-right font-mono" oninput="formatCurrency(this)">
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label class="block text-sm font-bold text-blue-800 mb-3">집행자 선택 (1명 필수)</label>
                <div id="executorContainer" class="grid grid-cols-3 gap-2"></div>
            </div>

            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                <label class="block text-sm font-bold text-orange-800 mb-3">승인자 선택 (1명 필수)</label>
                <div id="approverContainer" class="grid grid-cols-2 gap-2"></div>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <label class="block text-sm font-bold text-slate-700 mb-3 flex justify-between">
                    참석 인원 선택 <span class="text-indigo-600"><span id="pCount">0</span>명</span>
                </label>
                <div id="memberContainer" class="grid grid-cols-3 gap-2"></div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
                📧 데이터 전송 테스트
            </button>
        </form>
    </div>

    <script>
        const teamMembers = ["강백호", "서태웅", "송태섭", "정대만", "채치수", "권준호", "이한나", "안감독", "양호열"];
        const approvers = ["최원석", "이사장님"];

        function formatCurrency(input) {
            let value = input.value.replace(/[^0-9]/g, "");
            input.value = value ? Number(value).toLocaleString() : "";
        }

        function createCard(name, type, groupName, containerId, onChangeFn) {
            const container = document.getElementById(containerId);
            const label = document.createElement('label');
            label.className = `flex items-center p-2 bg-white border rounded-lg cursor-pointer hover:border-indigo-300 transition-colors has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500`;
            label.innerHTML = `
                <input type="${type}" name="${groupName}" value="${name}" class="hidden" ${onChangeFn ? `onchange="${onChangeFn}"` : ""}>
                <span class="text-sm text-slate-700 mx-auto font-medium">${name}</span>
            `;
            container.appendChild(label);
        }

        teamMembers.forEach(name => createCard(name, 'radio', 'executor', 'executorContainer', ''));
        approvers.forEach(name => createCard(name, 'radio', 'approver', 'approverContainer', ''));
        teamMembers.forEach(name => createCard(name, 'checkbox', 'participant', 'memberContainer', 'updateCount()'));

        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        function updateCount() {
            const checked = document.querySelectorAll('input[name="participant"]:checked');
            document.getElementById('pCount').innerText = checked.length;
        }

        document.getElementById('receiptForm').onsubmit = async function(e) {
            e.preventDefault();
            const executor = document.querySelector('input[name="executor"]:checked')?.value;
            const approver = document.querySelector('input[name="approver"]:checked')?.value;
            const participants = Array.from(document.querySelectorAll('input[name="participant"]:checked')).map(cb => cb.value);
            const mealExp = document.getElementById('mealExp').value.replace(/,/g, "") || 0;
            const snackExp = document.getElementById('snackExp').value.replace(/,/g, "") || 0;

            const payload = {
                date: document.getElementById('date').value,
                vendor: document.getElementById('vendor').value,
                mealExp: Number(mealExp),
                snackExp: Number(snackExp),
                executor: executor,
                approver: approver,
                participants: participants,
                count: participants.length
            };

            try {
                // 상대 경로 사용하여 백엔드 호출
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ 데이터가 백엔드로 전송되었습니다!");
                } else {
                    alert("❌ 전송 실패!");
                }
            } catch (err) {
                alert("❌ 에러 발생: " + err.message);
            }
        };
    </script>
</body>
</html>
