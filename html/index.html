<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영수증 메일 발송 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h1 class="text-2xl font-extrabold mb-6 text-slate-800 flex items-center gap-2">
            <span>🧾</span> 영수증 정산 폼
        </h1>
        
        <form id="receiptForm" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">집행 일자</label>
                    <input type="date" id="date" required class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">금액 (원)</label>
                    <input type="number" id="amount" placeholder="0" required class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">집행처</label>
                    <input type="text" id="vendor" placeholder="식당명 등" required class="w-full rounded-lg border-slate-200 shadow-sm focus:ring-2 focus:ring-indigo-500 p-2.5 border outline-none">
                </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <label class="block text-sm font-bold text-slate-700 mb-3 flex justify-between">
                    참석 인원 선택 
                    <span class="text-indigo-600"><span id="pCount">0</span> / 9명</span>
                </label>
                
                <div id="memberContainer" class="grid grid-cols-3 gap-2">
                    </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
                📧 Gmail로 영수증 발송
            </button>
        </form>
    </div>

    <script>
        // 고정된 9명의 명단 (본인 팀원 이름으로 수정하세요)
        const teamMembers = [
            "강백호", "서태웅", "송태섭", 
            "정대만", "채치수", "권준호", 
            "이한나", "안감독", "양호열"
        ];

        // 페이지 로드 시 체크박스 생성
        const container = document.getElementById('memberContainer');
        teamMembers.forEach(name => {
            const label = document.createElement('label');
            label.className = "flex items-center p-2 bg-white border rounded-lg cursor-pointer hover:border-indigo-300 transition-colors has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500";
            label.innerHTML = `
                <input type="checkbox" name="participant" value="${name}" class="hidden" onchange="updateCount()">
                <span class="text-sm text-slate-700 mx-auto font-medium">${name}</span>
            `;
            container.appendChild(label);
        });

        // 오늘 날짜 세팅
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        // 선택 인원수 업데이트
        function updateCount() {
            const checked = document.querySelectorAll('input[name="participant"]:checked');
            document.getElementById('pCount').innerText = checked.length;
        }

        // 폼 제출 시 데이터 수집 예시
        document.getElementById('receiptForm').onsubmit = function(e) {
            e.preventDefault();
            const selectedNames = Array.from(document.querySelectorAll('input[name="participant"]:checked')).map(cb => cb.value);
            
            if(selectedNames.length === 0) {
                alert("참석자를 한 명 이상 선택해주세요!");
                return;
            }

            const payload = {
                date: document.getElementById('date').value,
                amount: document.getElementById('amount').value,
                vendor: document.getElementById('vendor').value,
                participants: selectedNames,
                count: selectedNames.length
            };

            console.log("전송될 데이터:", payload);
            alert(`${payload.count}명의 영수증 데이터를 전송할 준비가 되었습니다!`);
        };
    </script>
</body>
</html>
