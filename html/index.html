<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영수증 메일 발송 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">🧾 영수증 정보 입력</h1>
        
        <form id="receiptForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">집행 일자</label>
                <input type="date" id="date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">금액 (원)</label>
                <input type="number" id="amount" placeholder="예: 50000" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">집행처 (상호명)</label>
                <input type="text" id="vendor" placeholder="예: ○○식당" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">참석 인원 (<span id="pCount">1</span>명)</label>
                <div id="participantList" class="space-y-2">
                    <div class="flex gap-2">
                        <input type="text" name="participant" placeholder="이름 입력" required class="flex-1 rounded-md border-gray-300 shadow-sm p-2 border">
                        <button type="button" onclick="addParticipant()" class="bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600">+</button>
                    </div>
                </div>
            </div>

            <hr class="my-6">

            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-md hover:bg-green-700 transition duration-200">
                📧 Gmail로 영수증 발송하기
            </button>
        </form>
    </div>

    <script>
        // 오늘 날짜 기본 세팅
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        // 인원 추가 함수
        function addParticipant() {
            const list = document.getElementById('participantList');
            const div = document.createElement('div');
            div.className = "flex gap-2 mt-2";
            div.innerHTML = `
                <input type="text" name="participant" placeholder="이름 입력" required class="flex-1 rounded-md border-gray-300 shadow-sm p-2 border">
                <button type="button" onclick="this.parentElement.remove(); updateCount();" class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600">-</button>
            `;
            list.appendChild(div);
            updateCount();
        }

        // 인원수 업데이트
        function updateCount() {
            const count = document.getElementsByName('participant').length;
            document.getElementById('pCount').innerText = count;
        }

        // 폼 제출 이벤트 (나중에 백엔드 연동할 부분)
        document.getElementById('receiptForm').onsubmit = function(e) {
            e.preventDefault();
            alert('백엔드가 준비되면 메일이 발송됩니다!');
            // 여기서 fetch()를 이용해 API로 데이터를 보낼 예정입니다.
        };
    </script>
</body>
</html>
